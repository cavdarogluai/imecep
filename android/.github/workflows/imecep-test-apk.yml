name: imeCep test APK

on:
  workflow_dispatch:
  push:
    branches: [ "claude/project-thread-8ipvqc" ]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build debug APKs
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: |
          cd app/build/outputs/apk/debug
          ls -lh
          cp app-arm64-v8a-debug.apk ../../../../../imecep-test-arm64.apk
          cp app-universal-debug.apk ../../../../../imecep-test-universal.apk
      - name: Publish test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="imecep-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" imecep-test-arm64.apk imecep-test-universal.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "imeCep test build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug-signed test build of imeCep for installing on own test phones. Not a store release."
